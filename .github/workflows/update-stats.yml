name: Update GitHub Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          username = "keremkose61"
          token = os.environ["GH_TOKEN"]

          def github_get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode("utf-8"))

          user = github_get(f"https://api.github.com/users/{username}")
          repos = github_get(
              f"https://api.github.com/users/{username}/repos?per_page=100&type=owner"
          )
          public_repos = [repo for repo in repos if not repo.get("fork", False)]
          stars = sum(repo.get("stargazers_count", 0) for repo in public_repos)
          updated = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          metrics = [
              ("PUBLIC REPOSITORIES", str(user.get("public_repos", 0))),
              ("FOLLOWERS", str(user.get("followers", 0))),
              ("STARS EARNED", str(stars)),
          ]

          cards = []
          positions = [18, 250, 482]
          for (label, value), x in zip(metrics, positions):
              cards.append(f"""
                <g transform="translate({x}, 18)">
                  <rect width="200" height="112" rx="12" fill="#101820" stroke="#1f6f4a" />
                  <rect width="4" height="112" rx="2" fill="#20e58a" />
                  <text x="20" y="38" fill="#9aa7b2" font-size="12" font-family="Arial, sans-serif" letter-spacing="1">{label}</text>
                  <text x="20" y="82" fill="#20e58a" font-size="34" font-weight="700" font-family="Arial, sans-serif">{value}</text>
                </g>
              """)

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg" width="700" height="158" viewBox="0 0 700 158" role="img" aria-label="GitHub profile statistics">
            <rect width="700" height="158" rx="16" fill="#0d1117" />
            {''.join(cards)}
            <text x="350" y="150" text-anchor="middle" fill="#7d8590" font-size="9" font-family="Arial, sans-serif">Updated {updated} · github.com/{username}</text>
          </svg>
          """

          with open("stats.svg", "w", encoding="utf-8") as file:
              file.write(svg)
          PY

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          if git diff --cached --quiet; then
            echo "Statistics have not changed."
            exit 0
          fi
          git commit -m "Update GitHub profile statistics"
          git push
